[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "subwise"
version = "0.1.0"
description = "SubWise: overlap-aware subscription portfolio optimizer with an evidence-backed research agent."
readme = "README.md"
requires-python = ">=3.12,<3.14"
# Exact pins: every version below was installed and contract-tested (see docs/verified-apis.md).
# Change a pin only together with its contract test in tests/integration/test_library_contracts.py.
dependencies = [
  "fastapi==0.165.0",
  "uvicorn==0.54.0",
  "pydantic==2.14.4",
  "email-validator==2.4.0",
  "pydantic-settings==2.16.3",
  "sqlalchemy==2.1.9",
  "alembic==1.20.1",
  "langgraph==1.2.24",
  "langgraph-checkpoint-sqlite==3.1.3",
  "ollama==0.6.3",
  # PuLP 3.3.x bundles the CBC solver (incl. Windows cbc.exe). PuLP 4.x does NOT bundle a
  # solver and changed its modelling API - do not upgrade without ADR-005 being revisited.
  "pulp==3.3.2",
  "httpx==0.28.1",
  "beautifulsoup4==4.15.0",
  "lxml==6.1.3",
  "pwdlib[argon2]==0.4.2",
  "pyjwt==2.15.1",
  "python-ulid==4.2.0",
]

[project.optional-dependencies]
# Optional web discovery. The app runs fully without it (NullSearchProvider).
search = ["tavily-python==0.8.5"]
# Optional JS rendering for pricing pages; after install run: python -m playwright install chromium
browser = ["playwright==1.65.2"]
dev = [
  "pytest==9.2.0",
  "pytest-cov==7.1.0",
  "respx==0.23.1",
  "hypothesis==6.170.17",
  "freezegun==1.5.5",
  "ruff==0.17.6",
  "mypy==2.4.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
subwise = ["py.typed"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not llm and not live and not e2e'"
markers = [
  "llm: needs a running local Ollama with the configured model (run: pytest -m llm)",
  "live: hits real provider websites (run: pytest -m live)",
  "e2e: drives the built frontend in a real browser (run: pytest -m e2e)",
]
filterwarnings = [
  "error::DeprecationWarning:subwise.*",
  # PuLP 3.3 announces its 4.0 API; we stay on 3.3.x deliberately (ADR-005).
  "ignore::DeprecationWarning:pulp.*",
]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "TID"]
ignore = [
  "RUF001", "RUF002", "RUF003",  # allow the rupee sign and en dashes in strings/comments
  "N818",  # exception names follow the blueprint (NotFound, LLMTimeout, ...)
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"langgraph.checkpoint.sqlite.SqliteSaver".msg = "Open checkpointers only via subwise.memory.backends."
"langgraph.store.sqlite.SqliteStore".msg = "Open stores only via subwise.memory.backends."

[tool.ruff.lint.per-file-ignores]
"src/subwise/memory/backends.py" = ["TID251"]
"tests/**" = ["TID251", "E501"]
"alembic/versions/**" = ["E501", "W291"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["subwise"]

[[tool.mypy.overrides]]
module = ["pulp.*", "tavily.*", "playwright.*"]
ignore_missing_imports = true
